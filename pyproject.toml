[project]
name = "neurotwin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "httpx>=0.28,<1",
    "numpy>=2.0,<3",
    "python-multipart>=0.0.20",
    "alembic>=1.15,<2",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "pillow>=12,<13",
    "pypdfium2>=5,<6",
    "pdfplumber>=0.11,<1",
    "rapidocr>=3,<4",
    "onnxruntime>=1.23,<2",
    "olefile>=0.47,<1",
    "defusedxml>=0.7,<1",
    "tzdata>=2025.2",
    "av>=16,<17",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "xlwt>=1.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
