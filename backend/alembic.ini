[alembic]
script_location = migrations
# The database is taken from NEUROTWIN_DATABASE_URL (see migrations/env.py); no URL and no secret is kept here.
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
